<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RAW CULT smoke test</title></head><body>
<script src="../config.js"></script><script src="../products.js"></script>
<script>
const checks=[];
checks.push(['config loaded', !!window.RAWCULT_CONFIG]);
checks.push(['products array', Array.isArray(window.RAWCULT_PRODUCTS)]);
checks.push(['published product', window.RAWCULT_PRODUCTS.some(p=>p.published!==false)]);
checks.push(['tee has sizes', window.RAWCULT_PRODUCTS.find(p=>p.id==='eternal-skull-tee')?.options?.length>0]);
checks.push(['no unpublished mug', !window.RAWCULT_PRODUCTS.some(p=>p.id==='eternal-mug'));
document.body.innerHTML='<pre>'+checks.map(([name,ok])=>(ok?'PASS':'FAIL')+' — '+name).join('\n')+'</pre>';
if(checks.some(([,ok])=>!ok)) throw new Error('RAW CULT smoke test failed');
</script></body></html>
